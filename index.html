<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生資訊 - 1132940</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      color: #333;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      padding: 40px 60px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 36px;
      color: #3366cc;
    }

    p {
      font-size: 20px;
      margin: 10px 0;
    }

    .student-id {
      font-size: 28px;
      font-weight: bold;
      color: #ff6600;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>學生資訊</h1>
    <p>學號：</p>
    <div class="student-id">1132940</div>
    <p>狀態：在學中</p>
  </div>

  <footer>
    © 2025 學生系統示範頁面
  </footer>
</body>
</html>
